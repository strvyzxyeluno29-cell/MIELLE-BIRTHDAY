 {from:"Kirsten",text:"Dear you,\n\n Happy 18th Birthday, Mielle! It’s crazy to think you’re officially turning 18, but seeing the bright, kind, and amazing person you’ve grown into makes this debut so exciting to celebrate. Entering adulthood opens up a whole new world, but you’ve already got the heart and brains to handle whatever comes next. Tonight is all about celebrating you, so don't stress about anything—just laugh, dance, eat good food, and make memories with the people who love you most.I hope this next year brings you closer to your biggest goals, surrounded by great friends and non-stop happiness. Keep being your awesome self, trust your instincts, and enjoy every single step of this new journey. Have an unforgettable night, Mielle! Cheers to 18! \n\nWith love,\nKirsten"}
];
const TYPE_SPEED=100; // milliseconds per letter (bigger = slower)
/* ======================================== */

// each button gets its own message box directly under it
let tt;
MESSAGES.forEach(m=>{
 const w=document.createElement('div');
 const b=document.createElement('button');b.className='btn';b.textContent=m.from+"'s message 💌";
 const p=document.createElement('div');p.className='paper';
 b.onclick=()=>show(p,b,m.text);
 w.append(b,p);$('mb').appendChild(w);
});
function show(p,b,t){
 clearInterval(tt);
 if(p.style.display==='block'){p.style.display='none';p.textContent='';return} // tap again = close
 document.querySelectorAll('.paper').forEach(e=>{if(e!==p){e.style.display='none';e.textContent=''}});
 p.style.display='block';p.className='paper';p.textContent='';
 b.scrollIntoView({behavior:'smooth',block:'start'});
 let i=0;
 tt=setInterval(()=>{p.textContent+=t[i++];p.scrollTop=p.scrollHeight;
  if(i>=t.length){clearInterval(tt);p.classList.add('done')}},TYPE_SPEED);
}
